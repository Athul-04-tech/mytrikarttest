<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0F3D2E" />

    <!-- SEO Primary Meta Tags -->
    <title>MytriKart Marketplace — Premium Multi-Vendor E-Commerce Platform</title>
    <meta name="title" content="MytriKart Marketplace — Premium Multi-Vendor E-Commerce Platform" />
    <meta name="description" content="Discover top deals on Mobiles, Electronics, Luxury Fashion, Home, and Beauty at MytriKart Marketplace. Enjoy verified seller offers, fast delivery, and Mytri Plus rewards." />
    <meta name="keywords" content="MytriKart, multi-vendor marketplace, online shopping, electronics sale, fashion deals, smartphones, home decor, verified sellers, express delivery" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://mytrikart.com/" />

    <!-- Open Graph / Facebook Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mytrikart.com/" />
    <meta property="og:title" content="MytriKart Marketplace — Premium Multi-Vendor E-Commerce Platform" />
    <meta property="og:description" content="Discover top deals on Mobiles, Electronics, Luxury Fashion, Home, and Beauty at MytriKart Marketplace. Enjoy verified seller offers, fast delivery, and Mytri Plus rewards." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1200&q=80" />
    <meta property="og:site_name" content="MytriKart Marketplace" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mytrikart.com/" />
    <meta name="twitter:title" content="MytriKart Marketplace — Premium Multi-Vendor E-Commerce Platform" />
    <meta name="twitter:description" content="Discover top deals on Mobiles, Electronics, Luxury Fashion, Home, and Beauty at MytriKart Marketplace." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1200&q=80" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- JSON-LD Structured Data Schema for Rich Search Snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://mytrikart.com/#website",
            "url": "https://mytrikart.com/",
            "name": "MytriKart Marketplace",
            "description": "Multi-Vendor E-Commerce Marketplace Platform",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://mytrikart.com/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://mytrikart.com/#organization",
            "name": "MytriKart Marketplace Inc.",
            "url": "https://mytrikart.com/",
            "logo": "https://mytrikart.com/logo.png",
            "sameAs": [
              "https://facebook.com/mytrikart",
              "https://twitter.com/mytrikart",
              "https://instagram.com/mytrikart"
            ]
          }
        ]
      }
    </script>
  </head>
  <body class="bg-[#FBF8F1] antialiased text-[#1A2420] selection:bg-[#D4AF37]/30 selection:text-[#0F3D2E]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
